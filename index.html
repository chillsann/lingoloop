<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fdfbf6">
  <meta name="description" content="Lingoloop — 零广告、零账号、数据完全本地的开源多语种学习应用：西班牙语、法语、俄语、德语、上海话。">
  <title>Lingoloop · 无广告多语种学习</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <a class="brand" href="#/learn" aria-label="Lingoloop 首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" width="34" height="34">
            <path d="M20 5c-7 0-12 5-12 11 0 4 2 7 5 9v6c0 2 1 4 3 4h8c2 0 3-2 3-4v-6c3-2 5-5 5-9 0-6-5-11-12-11z" fill="#4FAE82"/>
            <path d="M20 5c-7 0-12 5-12 11 0 4 2 7 5 9 3-2 5-5 5-9 0-4 1-8 2-11z" fill="#7FCBA6" opacity=".8"/>
            <circle cx="16" cy="17" r="2.4" fill="#fff"/>
            <circle cx="24" cy="17" r="2.4" fill="#fff"/>
            <circle cx="16" cy="17" r="1.1" fill="#2f4f42"/>
            <circle cx="24" cy="17" r="1.1" fill="#2f4f42"/>
            <path d="M17 23q3 2.5 6 0" stroke="#fff" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          </svg>
        </span>
        <span class="brand-text">Lingoloop</span>
        <span class="brand-badge">无广告</span>
      </a>
      <div class="stats" aria-label="学习状态">
        <div class="stat" id="stat-streak" title="连续学习天数"><span class="stat-ico">🔥</span><b>0</b></div>
        <div class="stat" id="stat-xp" title="累计经验值"><span class="stat-ico xp">✦</span><b>0</b></div>
        <div class="stat" id="stat-hearts" title="今日红心"><span class="stat-ico heart">♥</span><b>5</b></div>
      </div>
    </header>

    <div class="shell">
      <nav class="sidebar" id="sidebar" aria-label="主导航"></nav>
      <main class="main" id="view" tabindex="-1"></main>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="移动端导航"></nav>
  </div>

  <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true"></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>Lingoloop 需要启用 JavaScript 才能运行。</noscript>
  <script src="data/words.js"></script>
  <script src="app.js"></script>
</body>
</html>
